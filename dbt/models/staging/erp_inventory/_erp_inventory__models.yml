version: 2

models:
  - name: stg_erp_inventory__inventory
    description: "Staging Silver de 03_erp_inventory/inventory, tipado y limpiado desde Bronze. Materializada como TABLE fisica (>= 3000 filas)."
    columns:
      - name: inventory_id
        tests:
          - unique
          - not_null
      - name: product_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_erp_inventory__products_erp_reference')
                field: product_id
      - name: warehouse_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_erp_inventory__warehouses')
                field: warehouse_id
  - name: stg_erp_inventory__inventory_movements
    description: "Staging Silver de 03_erp_inventory/inventory_movements, tipado y limpiado desde Bronze. Materializada como TABLE fisica (>= 3000 filas)."
    columns:
      - name: movement_id
        tests:
          - unique
          - not_null
      - name: product_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_erp_inventory__products_erp_reference')
                field: product_id
      - name: warehouse_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_erp_inventory__warehouses')
                field: warehouse_id
  - name: stg_erp_inventory__product_cost_history
    description: "Staging Silver de 03_erp_inventory/product_cost_history, tipado y limpiado desde Bronze."
    columns:
      - name: product_id
        tests:
          - relationships:
              arguments:
