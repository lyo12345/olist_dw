                field: supplier_id
  - name: stg_erp_inventory__products_erp_reference
    description: "Staging Silver de 03_erp_inventory/products_erp_reference, tipado y limpiado desde Bronze."
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
